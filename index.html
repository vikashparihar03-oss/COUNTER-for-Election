<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style>
<title>Tally Counter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap">
<style>
/* Layout: one screen, no scroll. Totals strip, then one grid: age label column + four count buttons (ID सहित: पुरुष/महिला, ID रहित: पुरुष/महिला) in five rows that share the remaining height, then an undo/reset bar. */
:root {
  --bg: #eef1ec;
  --surface: #f8faf6;
  --fg: #16201b;
  --muted: #5b6b62;
  --line: #d3dad2;
  --male: #245f8f;
  --on-male: #f3f8fc;
  --female: #a8416a;
  --on-female: #fff4f8;
  --danger: #b3402f;
  --font: "Mukta", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713; --surface: #18221c; --fg: #e6ede7; --muted: #93a59a; --line: #2a372f;
    --male: #7fb8ea; --on-male: #0a2236; --female: #f09bbb; --on-female: #3a1022; --danger: #ef8a78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --surface: #18221c; --fg: #e6ede7; --muted: #93a59a; --line: #2a372f;
  --male: #7fb8ea; --on-male: #0a2236; --female: #f09bbb; --on-female: #3a1022; --danger: #ef8a78;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.2;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.wrap { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.summary { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr; gap: 6px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px; text-align: center; min-width: 0; }
.stat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.stat .num { font-size: 26px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat.total .num { font-size: 30px; }
.stat.m .num { color: var(--male); }
.stat.f .num { color: var(--female); }

.board {
  flex: 1; min-height: 0; display: grid; gap: 6px;
  grid-template-columns: 62px repeat(4, minmax(0, 1fr));
  grid-template-rows: auto auto repeat(5, minmax(48px, 1fr));
}
.hd { text-align: center; font-weight: 700; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.hd.grp { font-size: 14px; color: var(--fg); border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.hd.m { color: var(--male); }
.hd.f { color: var(--female); }
.rowlbl { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; }
.rowlbl .no { font-size: 12px; color: var(--muted); font-weight: 600; }
.rowlbl .age { font-size: 14px; font-weight: 700; line-height: 1.1; }
.rowlbl .tot { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tap {
  border-radius: 14px; border: 2px solid transparent; min-width: 0; min-height: 0;
  display: flex; align-items: center; justify-content: center; padding: 0;
  transition: transform 90ms ease-out;
}
.tap:active { transform: scale(0.95); }
.tap .n { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tap .n.bump { animation: bump 140ms ease-out; }
.tap.m.yes { background: var(--male); color: var(--on-male); }
.tap.f.yes { background: var(--female); color: var(--on-female); }
.tap.m.no { background: transparent; color: var(--male); border-color: var(--male); }
.tap.f.no { background: transparent; color: var(--female); border-color: var(--female); }
@keyframes bump { from { transform: scale(0.85); } to { transform: scale(1); } }

.bar { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; }
.btn { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn.armed { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: 0.4; cursor: default; }
.panel { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet .hint { margin: 0; font-size: 13px; color: var(--muted); }
.prow { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; }
.prow span { font-weight: 700; color: var(--muted); }
.prow input { min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.rowlbl .age { overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) {
  .tap { transition: none; }
  .tap .n.bump { animation: none; }
}
</style>

<div class="wrap">
  <div class="summary" aria-label="कुल गिनती">
    <div class="stat total"><div class="lbl">कुल</div><div class="num" id="tTotal">0</div></div>
    <div class="stat m"><div class="lbl">पुरुष</div><div class="num" id="tM">0</div></div>
    <div class="stat f"><div class="lbl">महिला</div><div class="num" id="tF">0</div></div>
    <div class="stat"><div class="lbl">EPIC ID</div><div class="num" id="tYes">0</div></div>
    <div class="stat"><div class="lbl">OTHER ID</div><div class="num" id="tNo">0</div></div>
  </div>

  <div class="board" id="board">
    <div class="hd" style="grid-column:1;grid-row:1"></div>
    <div class="hd grp" style="grid-column:2 / span 2;grid-row:1">EPIC ID</div>
    <div class="hd grp" style="grid-column:4 / span 2;grid-row:1">OTHER ID</div>
    <div class="hd" style="grid-column:1;grid-row:2"></div>
    <div class="hd m" style="grid-column:2;grid-row:2">पुरुष</div>
    <div class="hd f" style="grid-column:3;grid-row:2">महिला</div>
    <div class="hd m" style="grid-column:4;grid-row:2">पुरुष</div>
    <div class="hd f" style="grid-column:5;grid-row:2">महिला</div>
  </div>

  <div class="bar">
    <button class="btn" id="undo" type="button">↶ पीछे</button>
    <button class="btn" id="edit" type="button">✎ आयु बदलें</button>
    <button class="btn" id="reset" type="button">रीसेट</button>
  </div>
</div>

<div class="panel" id="panel" hidden>
  <div class="sheet" role="dialog" aria-label="आयु वर्ग बदलें">
    <h2>आयु वर्ग बदलें</h2>
    <p class="hint">जैसे 18 से 25 या 60+ लिखें। गिनती नहीं बदलेगी।</p>
    <div id="plist" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn" id="pdone" type="button">हो गया</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'age-gender-id-counter-v2';
  var GROUPS = ['18 से 25', '26 से 35', '36 से 58', '58 से ऊपर', '18 से 25'];
  var CELLS = [
    { k: 'my', cls: 'm yes', who: 'पुरुष', id: 'EPIC ID' },
    { k: 'fy', cls: 'f yes', who: 'महिला', id: 'EPIC ID' },
    { k: 'mn', cls: 'm no', who: 'पुरुष', id: 'OTHER ID' },
    { k: 'fn', cls: 'f no', who: 'महिला', id: 'OTHER ID' }
  ];
  function fresh() {
    var c = []; for (var i = 0; i < GROUPS.length; i++) c.push({ my: 0, mn: 0, fy: 0, fn: 0 });
    return { counts: c, history: [] };
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.counts) && s.counts.length === GROUPS.length && Array.isArray(s.history)) return s;
    } catch (e) {}
    return null;
  }
  var state = load() || fresh();
  if (!Array.isArray(state.labels) || state.labels.length !== GROUPS.length) state.labels = GROUPS.slice();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  var board = document.getElementById('board');
  var nodes = [];
  GROUPS.forEach(function (age, i) {
    var r = i + 3;
    var lbl = document.createElement('div');
    lbl.className = 'rowlbl';
    lbl.style.gridColumn = '1'; lbl.style.gridRow = String(r);
    lbl.innerHTML = '<span class="no">' + (i + 1) + '. आयु</span><span class="age">' + age + '</span><span class="tot">कुल <b data-sub>0</b></span>';
    board.appendChild(lbl);
    var o = { sub: lbl.querySelector('[data-sub]'), age: lbl.querySelector('.age') };
    CELLS.forEach(function (c, j) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tap ' + c.cls;
      b.dataset.g = i; b.dataset.k = c.k;
      b.style.gridColumn = String(j === 0 ? 2 : j === 1 ? 3 : j === 2 ? 4 : 5);
      b.style.gridRow = String(r);
      b.setAttribute('aria-label', c.who + ' ' + c.id + ' जोड़ें, आयु वर्ग ' + (i + 1));
      b.innerHTML = '<span class="n">0</span>';
      board.appendChild(b);
      o[c.k] = b.querySelector('.n');
    });
    nodes.push(o);
  });

  var tTotal = document.getElementById('tTotal'), tM = document.getElementById('tM'), tF = document.getElementById('tF');
  var tYes = document.getElementById('tYes'), tNo = document.getElementById('tNo');
  var undo = document.getElementById('undo'), reset = document.getElementById('reset');

  function render() {
    var sm = 0, sf = 0, sy = 0, sn = 0;
    state.counts.forEach(function (c, i) {
      CELLS.forEach(function (x) { nodes[i][x.k].textContent = c[x.k]; });
      nodes[i].age.textContent = state.labels[i];
      nodes[i].sub.textContent = c.my + c.mn + c.fy + c.fn;
      sm += c.my + c.mn; sf += c.fy + c.fn; sy += c.my + c.fy; sn += c.mn + c.fn;
    });
    tM.textContent = sm; tF.textContent = sf; tTotal.textContent = sm + sf;
    tYes.textContent = sy; tNo.textContent = sn;
    undo.disabled = !state.history.length;
    reset.disabled = !(sm + sf);
  }
  function bump(node) { node.classList.remove('bump'); void node.offsetWidth; node.classList.add('bump'); }

  board.addEventListener('click', function (e) {
    var b = e.target.closest('.tap'); if (!b) return;
    var g = Number(b.dataset.g), k = b.dataset.k;
    state.counts[g][k] += 1;
    state.history.push([g, k]);
    if (state.history.length > 500) state.history.shift();
    save(); render(); bump(nodes[g][k]); buzz(12);
  });
  undo.addEventListener('click', function () {
    var last = state.history.pop(); if (!last) return;
    var c = state.counts[last[0]]; c[last[1]] = Math.max(0, c[last[1]] - 1);
    save(); render(); bump(nodes[last[0]][last[1]]);
  });

  var timer = null;
  function disarm() { if (timer) { clearTimeout(timer); timer = null; } reset.classList.remove('armed'); reset.textContent = 'रीसेट'; }
  reset.addEventListener('click', function () {
    if (timer) { disarm(); var lb = state.labels; state = fresh(); state.labels = lb; save(); render(); return; }
    reset.classList.add('armed'); reset.textContent = 'पक्का? दोबारा दबाएँ';
    timer = setTimeout(disarm, 3000);
  });

  var edit = document.getElementById('edit'), panel = document.getElementById('panel');
  var plist = document.getElementById('plist'), pdone = document.getElementById('pdone');
  edit.addEventListener('click', function () {
    plist.innerHTML = '';
    state.labels.forEach(function (t, i) {
      var row = document.createElement('div'); row.className = 'prow';
      var n = document.createElement('span'); n.textContent = (i + 1) + '.';
      var inp = document.createElement('input');
      inp.type = 'text'; inp.maxLength = 20; inp.value = t; inp.id = 'age' + i;
      inp.setAttribute('aria-label', 'आयु वर्ग ' + (i + 1));
      row.appendChild(n); row.appendChild(inp); plist.appendChild(row);
    });
    panel.hidden = false;
    plist.querySelector('input').focus();
  });
  function closePanel() {
    var inputs = plist.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
      var v = inputs[i].value.trim();
      state.labels[i] = v || GROUPS[i];
    }
    save(); render(); panel.hidden = true;
  }
  pdone.addEventListener('click', closePanel);
  panel.addEventListener('click', function (e) { if (e.target === panel) closePanel(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) closePanel(); });

  render();
})();
</script>

</html>
